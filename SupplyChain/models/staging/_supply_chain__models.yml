version: 2

models:
  - name: customers
    description: >
      Référentiel des clients nettoyé et dédupliqué.
      Le grain est une ligne par client.

    columns:
      - name: customer_id
        description: Identifiant métier unique du client.
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

      - name: customer_segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ENTERPRISE
                  - SMB
                  - CONSUMER

      - name: country
        data_tests:
          - not_null

      - name: loaded_at
        data_tests:
          - not_null

  - name: products
    description: >
      Référentiel des produits nettoyé et dédupliqué.
      Le grain est une ligne par produit.

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_name
        data_tests:
          - not_null

      - name: product_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ELECTRONICS
                  - INDUSTRIAL
                  - PACKAGING
                  - SAFETY

      - name: standard_cost
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: list_price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: weight_kg
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: is_active
        data_tests:
          - not_null

  - name: suppliers
    description: >
      Référentiel des fournisseurs nettoyé et dédupliqué.
      Le grain est une ligne par fournisseur.

    columns:
      - name: supplier_id
        data_tests:
          - not_null
          - unique

      - name: supplier_name
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null

      - name: risk_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - LOW
                  - MEDIUM
                  - HIGH

      - name: default_lead_time_days
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: warehouses
    description: >
      Référentiel des entrepôts.
      Le grain est une ligne par entrepôt.

    columns:
      - name: warehouse_id
        data_tests:
          - not_null
          - unique

      - name: warehouse_name
        data_tests:
          - not_null

      - name: country
        data_tests:
          - not_null

      - name: region
        data_tests:
          - not_null

      - name: capacity_units
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

  - name: carriers
    description: >
      Référentiel des transporteurs.
      Le grain est une ligne par transporteur.

    columns:
      - name: carrier_id
        data_tests:
          - not_null
          - unique

      - name: carrier_name
        data_tests:
          - not_null

      - name: service_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - EXPRESS
                  - STANDARD
                  - OCEAN
                  - FREIGHT
                  - ECONOMY

  - name: orders
    description: >
      En-têtes des commandes clients nettoyés.
      Le grain est une ligne par commande.

    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id

      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('warehouses')
                field: warehouse_id

      - name: order_date
        data_tests:
          - not_null

      - name: promised_date
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - DELIVERED
                  - SHIPPED
                  - CANCELLED
                  - PROCESSING

      - name: sales_channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - B2B
                  - ECOMMERCE
                  - DISTRIBUTOR

      - name: currency_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - USD

      - name: source_updated_at
        data_tests:
          - not_null

      - name: loaded_at
        data_tests:
          - not_null

  - name: order_lines
    description: >
      Lignes des commandes clients.
      Le grain est une ligne par ligne de commande.

    columns:
      - name: order_line_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('products')
                field: product_id

      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: unit_price
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: discount_pct
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 and discount_pct <= 1"

      - name: line_amount
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: shipments
    description: >
      Expéditions nettoyées et dédupliquées.
      Le grain est une ligne par expédition.

    columns:
      - name: shipment_id
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id

      - name: carrier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('carriers')
                field: carrier_id

      - name: ship_date
        data_tests:
          - not_null

      - name: shipment_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - DELIVERED
                  - IN_TRANSIT

      - name: freight_cost
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: tracking_number
        data_tests:
          - not_null

  - name: purchase_orders
    description: >
      En-têtes des commandes fournisseurs.
      Le grain est une ligne par commande fournisseur.

    columns:
      - name: purchase_order_id
        data_tests:
          - not_null
          - unique

      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('suppliers')
                field: supplier_id

      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('warehouses')
                field: warehouse_id

      - name: order_date
        data_tests:
          - not_null

      - name: expected_date
        data_tests:
          - not_null

      - name: purchase_order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - RECEIVED
                  - OPEN
                  - CANCELLED

  - name: purchase_order_lines
    description: >
      Lignes des commandes fournisseurs.
      Le grain est une ligne par ligne de commande fournisseur.

    columns:
      - name: po_line_id
        data_tests:
          - not_null
          - unique

      - name: purchase_order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('purchase_orders')
                field: purchase_order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('products')
                field: product_id

      - name: ordered_qty
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: received_qty
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: unit_cost
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: inventory_snapshots
    description: >
      État quotidien du stock.
      Le grain est date, entrepôt et produit.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date
              - warehouse_id
              - product_id

    columns:
      - name: snapshot_date
        data_tests:
          - not_null

      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('warehouses')
                field: warehouse_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('products')
                field: product_id

      - name: on_hand_qty
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: allocated_qty
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: available_qty
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

      - name: reorder_point
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
