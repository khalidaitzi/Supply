name: dbt CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "SupplyChain/models/**"
      - "SupplyChain/tests/**"
      - "SupplyChain/snapshots/**"
      - "SupplyChain/macros/**"
      - "SupplyChain/seeds/**"
      - "SupplyChain/analyses/**"
      - "SupplyChain/dbt_project.yml"
      - "SupplyChain/packages.yml"
      - ".github/workflows/dbt-ci.yml"

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # =====================================================
  # CI : PULL REQUEST VERS MAIN
  # =====================================================

  dbt-ci:
    name: Validate dbt pull request

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    environment:
      name: DBT_SUPPLYCHAIN_CI
      deployment: false

    timeout-minutes: 45

    defaults:
      run:
        working-directory: SupplyChain

    env:
      DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
      DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
      DBT_PRIVATE_KEY_PATH: /home/runner/.dbt/rsa_key.p8

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}

      DBT_TARGET_SCHEMA: DBT_CI_PR_${{ github.event.pull_request.number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dbt-core==1.12.6 \
            dbt-snowflake==1.12.3

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "${DBT_PROFILES_YML}" || {
            echo "::error::DBT_PROFILES_YML is empty"
            exit 1
          }

          test -n "${DBT_PRIVATE_KEY}" || {
            echo "::error::DBT_PRIVATE_KEY is empty"
            exit 1
          }

          test -n "${SNOWFLAKE_ACCOUNT}" || {
            echo "::error::SNOWFLAKE_ACCOUNT is empty"
            exit 1
          }

          test -n "${SNOWFLAKE_USER}" || {
            echo "::error::SNOWFLAKE_USER is empty"
            exit 1
          }

      - name: Set up dbt profile and private key
        shell: bash
        run: |
          mkdir -p "${HOME}/.dbt"

          printf '%s' "${DBT_PROFILES_YML}" \
            > "${HOME}/.dbt/profiles.yml"

          printf '%s' "${DBT_PRIVATE_KEY}" \
            > "${DBT_PRIVATE_KEY_PATH}"

          chmod 600 "${DBT_PRIVATE_KEY_PATH}"

          test -s "${HOME}/.dbt/profiles.yml"
          test -s "${DBT_PRIVATE_KEY_PATH}"

      - name: Install dbt dependencies
        run: dbt deps

      - name: Validate CI connection
        run: dbt debug --target ci

      - name: Parse project
        run: dbt parse --target ci --no-partial-parse

      - name: Compile project
        run: dbt compile --target ci

      - name: Build and test CI project
        run: |
          dbt build \
            --target ci \
            --vars '{"incremental_lookback_days": 3}'

      - name: Generate CI documentation
        run: dbt docs generate --target ci

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts-pr-${{ github.event.pull_request.number }}
          path: |
            SupplyChain/target/manifest.json
            SupplyChain/target/run_results.json
            SupplyChain/target/catalog.json
            SupplyChain/target/sources.json
          if-no-files-found: ignore
          retention-days: 14


  # =====================================================
  # CD : MERGE / PUSH SUR MAIN
  # =====================================================

  dbt-production:
    name: Deploy dbt production

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: DBT_SUPPLYCHAIN_PROD

    timeout-minutes: 60

    defaults:
      run:
        working-directory: SupplyChain

    env:
      DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
      DBT_PRIVATE_KEY: ${{ secrets.DBT_PRIVATE_KEY }}
      DBT_PRIVATE_KEY_PATH: /home/runner/.dbt/rsa_key.p8

      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}

      DBT_TARGET_SCHEMA: PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dbt-core==1.12.6 \
            dbt-snowflake==1.12.3

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "${DBT_PROFILES_YML}" || {
            echo "::error::DBT_PROFILES_YML is empty"
            exit 1
          }

          test -n "${DBT_PRIVATE_KEY}" || {
            echo "::error::DBT_PRIVATE_KEY is empty"
            exit 1
          }

          test -n "${SNOWFLAKE_ACCOUNT}" || {
            echo "::error::SNOWFLAKE_ACCOUNT is empty"
            exit 1
          }

          test -n "${SNOWFLAKE_USER}" || {
            echo "::error::SNOWFLAKE_USER is empty"
            exit 1
          }

      - name: Set up dbt profile and private key
        shell: bash
        run: |
          mkdir -p "${HOME}/.dbt"

          printf '%s' "${DBT_PROFILES_YML}" \
            > "${HOME}/.dbt/profiles.yml"

          printf '%s' "${DBT_PRIVATE_KEY}" \
            > "${DBT_PRIVATE_KEY_PATH}"

          chmod 600 "${DBT_PRIVATE_KEY_PATH}"

          test -s "${HOME}/.dbt/profiles.yml"
          test -s "${DBT_PRIVATE_KEY_PATH}"

      - name: Install dbt dependencies
        run: dbt deps

      - name: Validate production connection
        run: dbt debug --target prod

      - name: Parse production project
        run: dbt parse --target prod --no-partial-parse

      - name: Compile production project
        run: dbt compile --target prod

      - name: Check production source freshness
        run: dbt source freshness --target prod

      - name: Build production project
        run: |
          dbt build \
            --target prod \
            --vars '{"incremental_lookback_days": 3}'

      - name: Generate production documentation
        run: dbt docs generate --target prod

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-artifacts-${{ github.sha }}
          path: |
            SupplyChain/target/manifest.json
            SupplyChain/target/run_results.json
            SupplyChain/target/catalog.json
            SupplyChain/target/sources.json
            SupplyChain/target/index.html
          if-no-files-found: ignore
          retention-days: 90
