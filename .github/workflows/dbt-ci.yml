name: dbt CI/CD

on:
  pull_request:
    branches:
      - main

    paths:
      - "SupplyChain/models/**"
      - "SupplyChain/tests/**"
      - "SupplyChain/snapshots/**"
      - "SupplyChain/macros/**"
      - "SupplyChain/seeds/**"
      - "SupplyChain/analyses/**"
      - "SupplyChain/dbt_project.yml"
      - "SupplyChain/packages.yml"
      - ".github/workflows/dbt-ci.yml"

  push:
    branches:
      - main

    paths:
      - "SupplyChain/models/**"
      - "SupplyChain/tests/**"
      - "SupplyChain/snapshots/**"
      - "SupplyChain/macros/**"
      - "SupplyChain/seeds/**"
      - "SupplyChain/analyses/**"
      - "SupplyChain/dbt_project.yml"
      - "SupplyChain/packages.yml"
      - ".github/workflows/dbt-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  dbt-ci:
    name: Validate dbt pull request

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    environment:
      name: DBT_BTC
      deployment: false

    timeout-minutes: 45

    defaults:
      run:
        working-directory: SupplyChain

    env:
      DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
      DBT_PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dbt-core==1.12.6 \
            dbt-snowflake==1.12.3

      - name: Set up dbt profile
        shell: bash
        run: |
          mkdir -p "${HOME}/.dbt"
          printf '%s' "${DBT_PROFILES_YML}" \
            > "${HOME}/.dbt/profiles.yml"

      - name: Install dbt packages
        run: dbt deps

      - name: Validate dbt connection
        run: dbt debug --target dev

      - name: Parse dbt project
        run: dbt parse --target dev --no-partial-parse

      - name: Compile dbt project
        run: dbt compile --target dev

      - name: Build and test dbt project
        run: dbt build --target dev

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts-pr-${{ github.event.pull_request.number }}

          path: |
            SupplyChain/target/manifest.json
            SupplyChain/target/run_results.json
            SupplyChain/target/catalog.json
            SupplyChain/target/sources.json

          if-no-files-found: ignore
          retention-days: 14


  dbt-production:
    name: Deploy dbt after merge

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: DBT_BTC

    timeout-minutes: 60

    defaults:
      run:
        working-directory: SupplyChain

    env:
      DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
      DBT_PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            dbt-core==1.12.6 \
            dbt-snowflake==1.12.3

      - name: Set up dbt profile
        shell: bash
        run: |
          mkdir -p "${HOME}/.dbt"
          printf '%s' "${DBT_PROFILES_YML}" \
            > "${HOME}/.dbt/profiles.yml"

      - name: Install dbt packages
        run: dbt deps

      - name: Validate dbt connection
        run: dbt debug --target dev

      - name: Parse dbt project
        run: dbt parse --target dev --no-partial-parse

      - name: Check source freshness
        run: dbt source freshness --target dev

      - name: Build dbt project
        run: dbt build --target dev

      - name: Generate dbt documentation
        run: dbt docs generate --target dev

      - name: Upload production artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.sha }}

          path: |
            SupplyChain/target/manifest.json
            SupplyChain/target/run_results.json
            SupplyChain/target/catalog.json
            SupplyChain/target/sources.json
            SupplyChain/target/index.html

          if-no-files-found: ignore
          retention-days: 90
